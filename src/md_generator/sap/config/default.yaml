input:
  paths: []
  odata_urls: []

output:
  path: output/sap-md
  split_files: true
  write_manifest: true
  markdown_cross_links: true

features:
  include:
    - entities
    - technical
    - functional
    - relationships
    - lineage
    - governance
    - authorization
    - validations
    - graphs
    - chunks
    - json_output
    - odata_catalog
  exclude: []

parser:
  plugins: []
  include_abap: true
  include_cds: true
  include_ddic: true
  include_odata: true
  include_bapi: true
  include_idoc: true
  include_transport: true
  include_hana: true
  include_bw: true
  include_datasphere: true
  include_external: false

odata:
  fetch_timeout_sec: 30
  verify_tls: true
  cache_fetched: true

analyzer:
  lineage: true
  governance: true
  relationships: true
  validations: true
  authorization: true
  semantics: true

chunking:
  enabled: false
  types:
    - entity
    - relationship
    - validation
    - authorization
    - lineage

graph:
  enabled: false
  mermaid: true
  json_export: true

performance:
  workers: 4
  cache_dir: null
  incremental: true
  stream_threshold_mb: 5
  intelligence_list_cap: 80

pipeline:
  version: 1
  canonical_json: true
  artifact_graph: true
  rule_engine: true
  openlineage_export: false
  cross_lineage: false
  semantic_chunks_jsonl: false
  event_bus: false

abap_journey:
  traversal:
    max_depth: 1000
    expand_forms: true
    expand_methods: true
    expand_functions: true
    expand_includes: true
    expand_function_groups: true
    stop_at_sap_standard: true
    customer_namespaces:
      - "Z*"
      - "Y*"
  renderers:
    mermaid: true
    json: true
    graphviz: true
    markdown: true
  cache:
    enabled: true
    cache_dir: null
  plugins:
    extractors:
      - "perform"
      - "function"
      - "method"
      - "submit"
      - "transaction"
      - "screen"
      - "include"
      - "create_object"
      - "new"
  statistics:
    enabled: true
